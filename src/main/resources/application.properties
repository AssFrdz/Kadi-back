spring.application.name=kadi-back

# Base de données par défaut : PostgreSQL lancé via `docker compose up -d`
spring.datasource.url=jdbc:postgresql://localhost:5432/kadi
spring.datasource.username=kadi
spring.datasource.password=kadi

# Le schéma est géré UNIQUEMENT par Flyway (src/main/resources/db/migration).
# Hibernate se contente de vérifier que les entités correspondent au schéma.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Le jeu de démonstration n'est chargé que par le profil demo : le retrouver en base sans ce profil est normal.
spring.flyway.ignore-migration-patterns=repeatable:missing

# Erreurs au format RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Swagger UI : http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

# Origines autorisées à appeler l'API (front Angular servi séparément)
app.cors.origines-autorisees=http://localhost:4200,http://127.0.0.1:4200

# SMTP standard ; les paramètres se configurent par variables d'environnement, sans fournisseur imposé.
spring.mail.host=${KADI_SMTP_HOST:}
spring.mail.port=${KADI_SMTP_PORT:587}
spring.mail.username=${KADI_SMTP_USERNAME:}
spring.mail.password=${KADI_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KADI_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${KADI_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${KADI_SMTP_STARTTLS:true}
app.mail.from=${KADI_MAIL_FROM:}
app.auth.verification-link-base=${KADI_VERIFICATION_LINK_BASE:http://localhost:4200/verification-email}
