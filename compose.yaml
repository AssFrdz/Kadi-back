services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kadi
      POSTGRES_USER: kadi
      POSTGRES_PASSWORD: kadi
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["email-test"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
